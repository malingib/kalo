name: Cache production build binaries
description: "Cache or restore if necessary"
runs:
  using: "composite"
  steps:
    - name: Generate cache key
      id: cache-key
      uses: ./.github/actions/cache-build-key
      with:
        branch_key: ${{ github.head_ref || github.ref_name }}
    - name: Cache production build
      uses: actions/cache@v4
      id: cache-build
      with:
        path: |
          ${{ github.workspace }}/apps/web/.next
          ${{ github.workspace }}/apps/web/public/embed
          **/.turbo/**
          **/dist/**
        key: ${{ steps.cache-key.outputs.key }}
    - run: |
        export NODE_OPTIONS="--max_old_space_size=8192"
        export NEXTAUTH_SECRET="${NEXTAUTH_SECRET:-ci-only-kalo-nextauth-secret-not-for-production}"
        export NEXTAUTH_URL="${NEXTAUTH_URL:-http://localhost:3000}"
        export CALENDSO_ENCRYPTION_KEY="${CALENDSO_ENCRYPTION_KEY:-ci-only-kalo-encryption-key-not-for-production-32-bytes}"
        yarn build
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: bash
