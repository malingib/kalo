name: Setup Database
# Keep this reusable workflow aligned with main: pull_request_target resolves workflow_call from the base branch.

on:
  workflow_call:
    inputs:
      DB_CACHE_HIT:
        required: false
        type: string
        default: "false"
        description: "Whether the DB cache was hit (skip yarn-install and cache-db if true)"

permissions:
  contents: read

jobs:
  setup-db:
    name: Setup Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CALENDSO_ENCRYPTION_KEY: ${{ secrets.CI_CALENDSO_ENCRYPTION_KEY }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calendso
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/calendso
      E2E_TEST_KALO_QA_EMAIL: ${{ secrets.E2E_TEST_KALO_QA_EMAIL }}
      E2E_TEST_KALO_QA_PASSWORD: ${{ secrets.E2E_TEST_KALO_QA_PASSWORD }}
      E2E_TEST_KALO_QA_GCAL_CREDENTIALS: ${{ secrets.E2E_TEST_KALO_QA_GCAL_CREDENTIALS }}
      GOOGLE_API_CREDENTIALS: ${{ secrets.CI_GOOGLE_API_CREDENTIALS }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calendso
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/yarn-install
        if: inputs.DB_CACHE_HIT != 'true'
      - run: yarn prisma generate
        if: inputs.DB_CACHE_HIT != 'true'
      - uses: ./.github/actions/cache-db
        if: inputs.DB_CACHE_HIT != 'true'
