name: Security Audit
on:
  workflow_call:
permissions:
  actions: write
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/yarn-install
      - name: Report all vulnerabilities
        run: yarn npm audit --all --recursive || true
      # Block both high and critical advisories; do not accept critical-only green runs.
      - name: Fail on high and critical vulnerabilities
        run: yarn npm audit --all --recursive --severity high
