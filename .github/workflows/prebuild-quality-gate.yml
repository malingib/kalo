name: Pre-build quality gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prebuild-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      LINGO_DOT_DEV_API_KEY: ${{ secrets.CI_LINGO_DOT_DEV_API_KEY }}
    steps:
      - name: Check out workflow configuration
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check out repository with project cache settings
        uses: ./.github/actions/cache-checkout

      - name: Install dependencies using repository setup
        uses: ./.github/actions/yarn-install

      - name: Regenerate app-store registries from retained source apps
        run: yarn app-store:build

      - name: Commit generated app-store registries
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/app-store/*.generated.ts packages/app-store/*.generated.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(app-store): regenerate integration registries"
          git push origin "HEAD:${HEAD_REF}"
          gh workflow run prebuild-quality-gate.yml --ref "${HEAD_REF}"

      - name: TypeScript checks
        run: yarn type-check:ci

      - name: Lint
        run: yarn lint

      - name: Generate Prisma client
        run: yarn prisma generate

      - name: Unit tests
        run: yarn test -- --no-isolate
        env:
          CI: true
          TZ: UTC
