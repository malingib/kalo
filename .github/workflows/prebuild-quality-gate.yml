name: Pre-build quality gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prebuild-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable pinned Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript checks
        run: yarn type-check:ci

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test
        env:
          CI: true
          TZ: UTC
