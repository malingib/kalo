name: Pre-build implementation gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prebuild-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, lint and generated-artifact verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      LINGO_DOT_DEV_API_KEY: ${{ secrets.CI_LINGO_DOT_DEV_API_KEY }}
    steps:
      - name: Check out workflow configuration
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check out repository with project cache settings
        uses: ./.github/actions/cache-checkout

      - name: Refresh Yarn lockfile for workspace removals
        run: yarn install --mode=update-lockfile

      - name: Install dependencies using repository setup
        uses: ./.github/actions/yarn-install

      - name: Regenerate app-store registries from retained source apps
        run: yarn app-store:build

      - name: Verify generated registries and lockfile are committed
        run: |
          git diff --exit-code -- yarn.lock packages/app-store/*.generated.ts packages/app-store/*.generated.tsx

      - name: TypeScript checks
        run: yarn type-check:ci

      - name: Lint
        run: yarn lint

      - name: Generate Prisma client
        run: yarn prisma generate
