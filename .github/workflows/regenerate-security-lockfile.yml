name: Regenerate security dependency lockfile

on:
  push:
    branches:
      - security/dependency-remediation

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'security: regenerate dependency lockfile') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable project Yarn version
        run: corepack enable
      - name: Regenerate dependency lockfile
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
          HUSKY: "0"
        run: yarn install
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock package.json apps/web/package.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches manifests."
            exit 0
          fi
          git commit -m "security: regenerate dependency lockfile"
          git push origin security/dependency-remediation
